<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Literacy Empire Adventure - The Ultimate Bahasa Indonesia Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: #131b2e;
      --bg-card-hover: #1a2540;
      --primary: #4f46e5;
      --primary-light: #6366f1;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --purple: #8b5cf6;
      --purple-glow: rgba(139, 92, 246, 0.3);
      --success: #10b981;
      --danger: #ef4444;
      --info: #06b6d4;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --border-glow: #3730a3;
      --radius: 16px;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-title: 'Cinzel', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, var(--bg-dark) 70%);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: #312e81;
      border-radius: 4px;
    }

    /* Container */
    .app-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Header Nav */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(19, 27, 46, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-icon {
      font-size: 28px;
      filter: drop-shadow(0 0 10px var(--accent-glow));
    }

    .brand-title {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 50%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(15, 23, 42, 0.7);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .stat-lives { color: #f87171; }
    .stat-score { color: #fbbf24; }
    .stat-combo { color: #a855f7; }

    /* Button styles */
    .btn {
      font-family: var(--font-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      user-select: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--purple) 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5);
    }

    .btn-accent {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-accent:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--primary-light);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 0.82rem;
      border-radius: 10px;
    }

    /* Views */
    .view-section {
      display: none;
      flex-direction: column;
      flex: 1;
      animation: fadeIn 0.4s ease-out;
    }

    .view-section.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero / Dashboard */
    .hero-card {
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid var(--border-glow);
      border-radius: 24px;
      padding: 36px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 28px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }

    .hero-card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    .hero-badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .hero-title {
      font-family: var(--font-title);
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 50%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      color: var(--text-muted);
      max-width: 650px;
      margin: 0 auto 24px auto;
      font-size: 1rem;
      line-height: 1.6;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* Player Summary Bar */
    .player-profile-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .strip-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform 0.2s;
    }

    .strip-card:hover {
      transform: translateY(-2px);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .strip-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .strip-meta h4 {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .strip-meta p {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
    }

    /* Section Title */
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .section-heading h2 {
      font-family: var(--font-title);
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Map of the Kingdom (Chapter Grid) */
    .realm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .realm-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    .realm-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary-light);
      box-shadow: 0 14px 30px rgba(99, 102, 241, 0.2);
    }

    .realm-card.locked {
      filter: grayscale(0.65) brightness(0.7);
      cursor: not-allowed;
    }

    .realm-card-banner {
      height: 110px;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 16px 20px;
      background-size: cover;
      background-position: center;
    }

    .realm-1 { background: linear-gradient(180deg, rgba(5,150,105,0.2), rgba(15,23,42,0.95)), #064e3b; }
    .realm-2 { background: linear-gradient(180deg, rgba(147,51,234,0.2), rgba(15,23,42,0.95)), #4c1d95; }
    .realm-3 { background: linear-gradient(180deg, rgba(14,165,233,0.2), rgba(15,23,42,0.95)), #0369a1; }
    .realm-4 { background: linear-gradient(180deg, rgba(16,185,129,0.2), rgba(15,23,42,0.95)), #14532d; }
    .realm-5 { background: linear-gradient(180deg, rgba(245,158,11,0.2), rgba(15,23,42,0.95)), #78350f; }
    .realm-6 { background: linear-gradient(180deg, rgba(236,72,153,0.2), rgba(15,23,42,0.95)), #831843; }

    .realm-icon-tag {
      width: 44px;
      height: 44px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      backdrop-filter: blur(8px);
    }

    .realm-status-tag {
      position: absolute;
      top: 14px;
      right: 16px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tag-completed {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid #10b981;
    }
    .tag-active {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid #f59e0b;
    }
    .tag-locked {
      background: rgba(148, 163, 184, 0.2);
      color: #94a3b8;
      border: 1px solid #475569;
    }

    .realm-card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .realm-ch-num {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .realm-title {
      font-family: var(--font-title);
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .realm-focus {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
      flex: 1;
    }

    .realm-progress-box {
      margin-bottom: 18px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    /* Chapter Intro & Briefing Modal/Card */
    .briefing-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.4);
    }

    .briefing-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .briefing-story {
      background: rgba(30, 27, 75, 0.4);
      border-left: 4px solid var(--accent);
      padding: 16px 20px;
      border-radius: 0 12px 12px 0;
      margin-bottom: 24px;
      font-style: italic;
      color: #e2e8f0;
      line-height: 1.6;
    }

    .briefing-material {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .briefing-material h3 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .briefing-material ul {
      padding-left: 20px;
      color: var(--text-muted);
      line-height: 1.7;
      font-size: 0.92rem;
    }

    /* Gameplay Screen */
    .gameplay-wrapper {
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
    }

    .game-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      padding: 14px 22px;
      border-radius: 18px;
      border: 1px solid var(--border);
    }

    .question-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 0.92rem;
    }

    .question-badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge-primary-src {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border: 1px solid #4f46e5;
    }

    .badge-dev-src {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid #d97706;
    }

    .timer-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent);
    }

    .timer-warning {
      color: var(--danger) !important;
      animation: pulse 0.7s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* Question Card */
    .question-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
    }

    .passage-box {
      background: rgba(15, 23, 42, 0.85);
      border-left: 4px solid var(--primary-light);
      padding: 16px 20px;
      border-radius: 0 14px 14px 0;
      margin-bottom: 20px;
      font-size: 0.94rem;
      line-height: 1.65;
      color: #e2e8f0;
      max-height: 220px;
      overflow-y: auto;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 22px;
      color: #fff;
    }

    /* Answer Options */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      color: var(--text);
      font-family: var(--font-main);
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      width: 100%;
    }

    .option-btn:hover:not(.locked-choice) {
      background: rgba(99, 102, 241, 0.1);
      border-color: var(--primary-light);
      transform: translateX(4px);
    }

    .option-btn.selected {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary-light);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.25) !important;
      border-color: #10b981 !important;
      color: #a7f3d0 !important;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.25) !important;
      border-color: #ef4444 !important;
      color: #fca5a5 !important;
    }

    .option-key {
      min-width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.selected .option-key {
      background: var(--primary);
      color: #fff;
    }

    .option-btn.correct .option-key {
      background: var(--success);
      color: #fff;
    }

    .option-btn.wrong .option-key {
      background: var(--danger);
      color: #fff;
    }

    .option-text {
      flex: 1;
      line-height: 1.45;
    }

    /* Complex Multi-Select Options */
    .checkbox-label {
      cursor: pointer;
    }

    /* Explanation Banner */
    .explanation-card {
      display: none;
      border-radius: 16px;
      padding: 18px 20px;
      margin-top: 18px;
      line-height: 1.6;
      font-size: 0.92rem;
      animation: fadeIn 0.3s ease;
    }

    .explanation-card.show-correct {
      display: block;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #e2e8f0;
    }

    .explanation-card.show-wrong {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #e2e8f0;
    }

    .explanation-heading {
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Action bar */
    .action-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
    }

    /* Mini-Game Containers */
    .minigame-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 22px;
      padding: 26px;
      margin-bottom: 24px;
    }

    .puzzle-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 18px 0;
    }

    .puzzle-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
      user-select: none;
      transition: all 0.2s;
    }

    .puzzle-item:hover {
      border-color: var(--primary-light);
      background: rgba(99, 102, 241, 0.08);
    }

    .puzzle-item.active-drag {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.15);
      cursor: grabbing;
    }

    .puzzle-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .puzzle-drag-handle {
      color: var(--text-muted);
      font-size: 18px;
    }

    .puzzle-btn-group {
      display: flex;
      gap: 6px;
    }

    /* Drag & Drop Columns */
    .drag-drop-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 20px 0;
    }

    .drop-bucket {
      background: rgba(15, 23, 42, 0.7);
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 16px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s;
    }

    .drop-bucket.drag-over {
      border-color: var(--accent);
      back
